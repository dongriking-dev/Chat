<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 登录画面 */
  #login-screen {
    background: #fff;
    padding: 48px 40px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    text-align: center;
    width: 360px;
  }
  #login-screen h1 {
    font-size: 24px;
    color: #1a73e8;
    margin-bottom: 8px;
  }
  #login-screen p {
    color: #5f6368;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    background: #fff;
    font-size: 15px;
    color: #3c4043;
    cursor: pointer;
    transition: background 0.2s;
  }
  .google-btn:hover { background: #f8f9fa; }
  .google-btn svg { width: 20px; height: 20px; }

  /* 聊天画面 */
  #chat-screen {
    display: none;
    width: 100%;
    max-width: 720px;
    height: 100vh;
    max-height: 800px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #e8eaed;
    background: #fff;
  }
  .chat-header .title {
    font-size: 18px;
    font-weight: 600;
    color: #202124;
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-info img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
  }
  .user-info .name {
    font-size: 14px;
    color: #3c4043;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .logout-btn {
    padding: 6px 14px;
    border: 1px solid #dadce0;
    border-radius: 20px;
    background: #fff;
    font-size: 13px;
    color: #5f6368;
    cursor: pointer;
    transition: background 0.2s;
  }
  .logout-btn:hover { background: #f1f3f4; }

  /* 消息列表 */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #f8f9fa;
  }
  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .msg img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .msg .bubble {
    background: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 70%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .msg .meta {
    font-size: 12px;
    color: #80868b;
    margin-bottom: 4px;
  }
  .msg .text {
    font-size: 14px;
    color: #202124;
    word-break: break-word;
    line-height: 1.5;
  }
  .msg.own {
    flex-direction: row-reverse;
  }
  .msg.own .bubble {
    background: #1a73e8;
  }
  .msg.own .text { color: #fff; }
  .msg.own .meta { color: rgba(255,255,255,0.8); }

  /* 输入栏 */
  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid #e8eaed;
    background: #fff;
  }
  .input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #dadce0;
    border-radius: 24px;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .input-bar input:focus { border-color: #1a73e8; }
  .input-bar button {
    padding: 0 24px;
    border: none;
    border-radius: 24px;
    background: #1a73e8;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .input-bar button:hover { background: #1557b0; }
  .input-bar button:disabled {
    background: #c4c7c5;
    cursor: not-allowed;
  }

  /* 滚动条 */
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb {
    background: #c4c7c5;
    border-radius: 3px;
  }
</style>
</head>
<body>

<!-- 登录画面 -->
<div id="login-screen">
  <h1>Chat App</h1>
  <p>ログインしてチャットを開始</p>
  <button class="google-btn" id="google-login">
    <svg viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Googleアカウントでログイン
  </button>
</div>

<!-- 聊天画面 -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="title">Chat</div>
    <div class="user-info">
      <img id="my-avatar" src="" alt="">
      <span class="name" id="my-name"></span>
      <button class="logout-btn" id="logout">ログアウト</button>
    </div>
  </div>
  <div id="messages"></div>
  <div class="input-bar">
    <input type="text" id="msg-input" placeholder="メッセージを入力..." autocomplete="off">
    <button id="send-btn" disabled>送信</button>
  </div>
</div>

<!-- Firebase SDK (v10 模块版) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* =========================================
   ① Firebase 設定（自分のプロジェクトの値に置き換えてください）
   ========================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* =========================================
   ② DOM 参照
   ========================================= */
const loginScreen = document.getElementById("login-screen");
const chatScreen  = document.getElementById("chat-screen");
const googleLoginBtn = document.getElementById("google-login");
const logoutBtn   = document.getElementById("logout");
const myAvatar    = document.getElementById("my-avatar");
const myName      = document.getElementById("my-name");
const messagesEl  = document.getElementById("messages");
const msgInput    = document.getElementById("msg-input");
const sendBtn     = document.getElementById("send-btn");

let currentUser = null;
let unsubscribeMessages = null;

/* =========================================
   ③ Google ログイン
   ========================================= */
googleLoginBtn.addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    console.error("ログインエラー:", err);
    alert("ログインに失敗しました: " + err.message);
  }
});

/* =========================================
   ④ ログアウト
   ========================================= */
logoutBtn.addEventListener("click", async () => {
  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }
  await signOut(auth);
});

/* =========================================
   ⑤ 認証状態の監視
   ========================================= */
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;

    // ニックネーム・アイコンを自動取得
    myName.textContent   = user.displayName || "匿名ユーザー";
    myAvatar.src         = user.photoURL || defaultAvatar(user.displayName);

    loginScreen.style.display = "none";
    chatScreen.style.display  = "flex";

    // メッセージ購読開始
    subscribeMessages();
  } else {
    currentUser = null;
    if (unsubscribeMessages) {
      unsubscribeMessages();
      unsubscribeMessages = null;
    }
    messagesEl.innerHTML = "";
    loginScreen.style.display = "block";
    chatScreen.style.display  = "none";
  }
});

/* =========================================
   ⑥ デフォルトアイコン生成（photoURL が無い場合）
   ========================================= */
function defaultAvatar(name) {
  const letter = (name || "?").charAt(0).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72">
    <rect width="100%" height="100%" fill="#1a73e8"/>
    <text x="50%" y="50%" font-size="36" fill="#fff"
      text-anchor="middle" dominant-baseline="central"
      font-family="sans-serif">${letter}</text>
  </svg>`;
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

/* =========================================
   ⑦ メッセージ購読（リアルタイム）
   ========================================= */
function subscribeMessages() {
  const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    messagesEl.innerHTML = "";
    snapshot.forEach((doc) => {
      renderMessage(doc.data());
    });
    scrollToBottom();
  }, (err) => {
    console.error("メッセージ取得エラー:", err);
  });
}

/* =========================================
   ⑧ メッセージ描画
   ========================================= */
function renderMessage(data) {
  const isOwn = currentUser && data.userId === currentUser.uid;

  const wrap = document.createElement("div");
  wrap.className = "msg" + (isOwn ? " own" : "");

  const img = document.createElement("img");
  img.src = data.photoURL || defaultAvatar(data.displayName);
  img.alt = "";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = data.displayName || "匿名";

  const text = document.createElement("div");
  text.className = "text";
  text.textContent = data.text || "";

  bubble.appendChild(meta);
  bubble.appendChild(text);
  wrap.appendChild(img);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
}

/* =========================================
   ⑨ メッセージ送信
   ========================================= */
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || !currentUser) return;

  sendBtn.disabled = true;
  try {
    await addDoc(collection(db, "messages"), {
      text: text,
      displayName: currentUser.displayName || "匿名ユーザー",
      photoURL: currentUser.photoURL || defaultAvatar(currentUser.displayName),
      userId: currentUser.uid,
      createdAt: serverTimestamp()
    });
    msgInput.value = "";
    msgInput.focus();
  } catch (err) {
    console.error("送信エラー:", err);
    alert("送信に失敗しました: " + err.message);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", sendMessage);
msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener("input", () => {
  sendBtn.disabled = msgInput.value.trim() === "";
});

/* =========================================
   ⑩ スクロール制御
   ========================================= */
function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
</script>
</body>
</html>
