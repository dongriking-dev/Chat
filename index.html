<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シクナイチャット</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%230284c7'/%3E%3Cpath d='M14 20h36v20H28l-8 8v-8h-6z' fill='%23fff'/%3E%3Ccircle cx='24' cy='30' r='3' fill='%230284c7'/%3E%3Ccircle cx='32' cy='30' r='3' fill='%230284c7'/%3E%3Ccircle cx='40' cy='30' r='3' fill='%230284c7'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-scroll { max-height: 60vh; overflow-y: auto; scrollbar-width: thin; }
    .msg-scroll::-webkit-scrollbar { width: 8px; }
    .msg-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .loading-spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid #f3f3f3; border-top: 2px solid #0284c7;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .optimistic-item { opacity: 0.55; pointer-events: none; position: relative; }
    .optimistic-item::after {
      content: "送信中..."; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); font-size: 10px; color: #0284c7;
      background: #eff6ff; padding: 2px 6px; border-radius: 4px; border: 1px solid #bfdbfe;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      border: 2px solid #e5e7eb; background: #f3f4f6;
    }
    .avatar-lg {
      width: 96px; height: 96px; border-radius: 50%;
      object-fit: cover; border: 3px solid #0284c7; background: #f3f4f6;
    }
    .msg-bubble {
      background: #fff; border: 1px solid #e5e7eb;
      border-radius: 12px; padding: 10px 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      word-break: break-word;
    }
    .msg-mine .msg-bubble {
      background: #dbeafe; border-color: #93c5fd;
    }
    .msg-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
    .msg-row.mine { flex-direction: row-reverse; }
    .msg-meta { font-size: 11px; color: #6b7280; margin-bottom: 2px; }
    .msg-meta .name { font-weight: 700; color: #1e40af; }
    .msg-meta .time { margin-left: 6px; }
    .msg-content { font-size: 14px; color: #111827; white-space: pre-wrap; }
    .msg-file img { max-height: 240px; max-width: 100%; border-radius: 8px; margin-top: 6px; border: 1px solid #e5e7eb; }
    .msg-file a { font-size: 12px; color: #2563eb; text-decoration: underline; word-break: break-all; }

    #statusBanner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      text-align: center; padding: 6px; font-size: 12px;
      transition: transform 0.3s; transform: translateY(-100%);
    }
    #statusBanner.show { transform: translateY(0); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 10000; padding: 16px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-content {
      background: #fff; border-radius: 8px; padding: 20px;
      max-width: 520px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      max-height: 90vh; overflow-y: auto;
    }

    #bootOverlay {
      position: fixed; inset: 0; background: #111827;
      z-index: 99997; display: flex;
      align-items: center; justify-content: center;
      color: #fff; font-family: sans-serif;
      flex-direction: column; gap: 16px;
    }
    #bootOverlay.hidden { display: none; }
    #bootOverlay .boot-spinner {
      width: 40px; height: 40px;
      border: 3px solid #374151;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #banOverlay {
      position: fixed; inset: 0; background: #000;
      z-index: 99999; display: none;
      align-items: center; justify-content: center;
      color: #fff; text-align: center; font-family: sans-serif;
      flex-direction: column; padding: 20px;
    }
    #banOverlay.show { display: flex; }

    .preset-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      cursor: pointer; border: 3px solid transparent;
      object-fit: cover; background: #f3f4f6;
    }
    .preset-avatar.selected { border-color: #0284c7; }

    .icon-btn {
      background: #f3f4f6; border: 1px solid #d1d5db;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
      font-size: 12px; color: #374151;
    }
    .icon-btn:hover { background: #e5e7eb; }

    .unread-badge {
      background: #ef4444; color: #fff;
      font-size: 10px; padding: 2px 6px; border-radius: 9999px;
      margin-left: 6px; font-weight: 700;
    }

    body { -webkit-user-select: none; user-select: none; }
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text; user-select: text;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-3xl mx-auto">

  <!-- 起動オーバーレイ -->
  <div id="bootOverlay">
    <div class="boot-spinner"></div>
    <div style="font-size:14px;color:#9ca3af;">アカウントを確認しています...</div>
  </div>

  <!-- BANオーバーレイ -->
  <div id="banOverlay">
    <div style="font-size:24px;font-weight:bold;letter-spacing:0.1em;" id="banOverlayMsg">アクセスが拒否されました</div>
    <div style="font-size:14px;margin-top:16px;color:#fca5a5;line-height:1.6;max-width:400px;" id="banOverlaySub"></div>
    <div style="margin-top:24px;" id="banOverlayActions">
      <button id="switchAccountBtn" style="font-size:13px;padding:10px 20px;border-radius:6px;border:none;cursor:pointer;font-weight:600;background:#2563eb;color:#fff;">別のGoogleアカウントでログイン</button>
    </div>
  </div>

  <!-- ステータスバナー -->
  <div id="statusBanner" class="bg-red-600 text-white"></div>

  <!-- ログイン画面 -->
  <div id="loginView" class="hidden">
    <div class="bg-white border border-gray-300 rounded-lg shadow p-8 max-w-md mx-auto mt-16 text-center">
      <h1 class="text-3xl font-bold text-blue-900 mb-2">シクナイチャット</h1>
      <p class="text-sm text-gray-600 mb-6">ご利用にはGoogleアカウントでのログインが必要です。</p>
      <p class="text-sm text-gray-600 mb-6">安全のためです。</p>
      <button id="googleLoginBtn"
        class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-3 px-6 rounded shadow-sm flex items-center justify-center gap-3 mx-auto transition w-full">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.3 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>
        Googleでログイン
      </button>
      <p class="text-xs text-gray-400 mt-4">※ チャットは匿名で表示されます</p>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="mainView" class="hidden">
    <header class="border-b-2 border-blue-800 pb-2 mb-4 flex justify-between items-center flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <img id="myAvatar" class="avatar" src="" alt="">
        <div>
          <h1 class="text-2xl font-bold text-blue-900">シクナイチャット</h1>
          <p class="text-xs text-gray-600 flex flex-wrap items-center gap-2">
            <span id="connDot" class="inline-block w-2 h-2 rounded-full bg-gray-400"></span>
            <span id="connText">接続中...</span>
            <span id="myName" class="font-bold text-blue-800"></span>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="profileBtn" class="icon-btn">👤 プロフィール</button>
        <button id="logoutBtn" class="bg-gray-500 hover:bg-gray-600 text-white text-xs py-1.5 px-3 rounded transition shadow">ログアウト</button>
      </div>
    </header>

    <!-- チャットルーム一覧 -->
    <div id="roomListView">
      <div class="bg-white border border-gray-300 rounded-lg p-4 mb-4 shadow-sm">
        <h2 class="text-md font-bold text-gray-700 mb-2">💬 チャットルーム</h2>
        <div class="flex gap-2">
          <input type="text" id="newRoomName" maxlength="30" placeholder="新しいルーム名を入力"
            class="flex-1 border p-2 rounded text-sm focus:ring-2 focus:ring-blue-300 outline-none">
          <button id="createRoomBtn" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded text-sm transition">作成</button>
        </div>
      </div>

      <div id="roomsContainer" class="space-y-2">
        <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> ルームを読み込み中...</p>
      </div>
    </div>

    <!-- チャット画面 -->
    <div id="chatView" class="hidden">
      <div class="bg-white p-3 border border-gray-300 rounded mb-3 shadow-sm flex justify-between items-center">
        <div>
          <h2 id="currentRoomName" class="text-lg font-bold text-blue-900"></h2>
          <p class="text-xs text-gray-500" id="currentRoomMeta"></p>
        </div>
        <button onclick="backToRooms()" class="bg-gray-600 hover:bg-gray-700 text-white text-xs py-1.5 px-3 rounded">← ルーム一覧</button>
      </div>

      <div id="messagesContainer" class="msg-scroll bg-gray-50 border border-gray-200 rounded p-3 mb-3">
        <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> メッセージを読み込み中...</p>
      </div>

      <form id="messageForm" class="bg-white border border-gray-300 rounded p-3 shadow-sm">
        <div class="flex items-end gap-2">
          <textarea id="messageInput" rows="1" maxlength="1000" placeholder="メッセージを入力..."
            class="flex-1 border p-2 rounded text-sm focus:ring-2 focus:ring-blue-300 outline-none resize-none"
            style="min-height:40px; max-height:120px;"></textarea>
          <label class="icon-btn cursor-pointer">
            📎
            <input type="file" id="messageFileInput" accept="image/*" class="hidden">
          </label>
          <button type="submit" id="sendBtn" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded text-sm transition">送信</button>
        </div>
        <div class="preview-box hidden mt-2" id="messagePreviewBox">
          <img id="messagePreviewImg" style="max-height:120px;border-radius:6px;">
          <div class="text-xs text-gray-500 mt-1" id="messagePreviewInfo"></div>
        </div>
      </form>
    </div>
  </div>

  <!-- プロフィールモーダル -->
  <div id="profileModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <h3 class="text-lg font-bold text-gray-800 mb-3">👤 プロフィール設定</h3>

      <div class="text-center mb-4">
        <img id="profileAvatarPreview" class="avatar-lg mx-auto" src="" alt="">
        <p class="text-xs text-gray-500 mt-2">アイコンを選択</p>
        <div id="presetAvatarRow" class="flex flex-wrap justify-center gap-2 mt-2"></div>
      </div>

      <label class="block text-xs text-gray-600 mb-1">ニックネーム（最大20文字）:</label>
      <input type="text" id="nicknameInput" maxlength="20" placeholder="例: 名無しさん"
        class="w-full border p-2 rounded text-sm mb-3 focus:ring-2 focus:ring-blue-300 outline-none">

      <label class="block text-xs text-gray-600 mb-1">または画像をアップロード:</label>
      <input type="file" id="avatarFileInput" accept="image/*" class="text-xs text-gray-600 w-full mb-3">

      <div class="flex justify-end gap-2 flex-wrap">
        <button id="profileCancelBtn" class="bg-gray-500 hover:bg-gray-600 text-white text-xs py-1.5 px-4 rounded">キャンセル</button>
        <button id="profileSaveBtn" class="bg-blue-800 hover:bg-blue-900 text-white text-xs py-1.5 px-4 rounded font-bold">保存</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getDatabase, ref, push, set, remove, onValue,
      query, orderByChild, get, update
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ========================================
    // ★ Firebase設定（chat-d04a6 プロジェクト）
    // ========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAexiMqMGTzd1r9IzHb4_aQomhPf-DCB6U",
      authDomain: "chat-d04a6.firebaseapp.com",
      databaseURL: "https://chat-d04a6-default-rtdb.firebaseio.com",
      projectId: "chat-d04a6",
      storageBucket: "chat-d04a6.firebasestorage.app",
      messagingSenderId: "290611121392",
      appId: "1:290611121392:web:c45ca30c8099f85bf08635",
      measurementId: "G-3ZENK6R0JV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence).catch((err) => {
      console.warn('永続化設定失敗:', err);
    });

    // ========================================
    // プリセットアバター（SVG dataURL）
    // ========================================
    function makeAvatarSvg(color, emoji) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="32" fill="${color}"/>
        <text x="32" y="42" font-size="32" text-anchor="middle">${emoji}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    const PRESET_AVATARS = [
      makeAvatarSvg('#0284c7', '😀'),
      makeAvatarSvg('#16a34a', '😎'),
      makeAvatarSvg('#dc2626', '🔥'),
      makeAvatarSvg('#7c3aed', '🌟'),
      makeAvatarSvg('#d97706', '🍀'),
      makeAvatarSvg('#db2777', '🌸'),
      makeAvatarSvg('#0891b2', '🐱'),
      makeAvatarSvg('#65a30d', '🐶'),
      makeAvatarSvg('#ea580c', '🦊'),
      makeAvatarSvg('#475569', '🐼'),
      makeAvatarSvg('#c026d3', '🎮'),
      makeAvatarSvg('#0d9488', '☕')
    ];

    const DEFAULT_AVATAR = makeAvatarSvg('#9ca3af', '👤');

    // ========================================
    // 画像圧縮
    // ========================================
    const IMAGE_MAX_WIDTH = 400;
    const IMAGE_QUALITY = 0.75;
    const IMAGE_MAX_BASE64_SIZE = 100 * 1024;

    function fileToBase64Image(file, maxW = IMAGE_MAX_WIDTH, maxSize = IMAGE_MAX_BASE64_SIZE) {
      return new Promise((resolve, reject) => {
        if (!file) { resolve(null); return; }
        if (!file.type.startsWith('image/')) {
          reject(new Error('画像ファイルを選択してください'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxW) {
              height = Math.round(height * (maxW / width));
              width = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            let quality = IMAGE_QUALITY;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            while (dataUrl.length > maxSize && quality > 0.3) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL('image/jpeg', quality);
            }
            if (dataUrl.length > maxSize) {
              reject(new Error('画像が大きすぎます'));
              return;
            }
            resolve({
              dataUrl, name: file.name, type: 'image/jpeg',
              width, height, size: dataUrl.length
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ========================================
    // 状態管理
    // ========================================
    let currentUser = null;
    let myProfile = { nickname: '', avatar: DEFAULT_AVATAR };
    let currentRoomId = null;
    let roomsUnsubscribe = null;
    let messagesUnsubscribe = null;
    let profilesUnsubscribe = null;
    let bansUnsubscribe = null;

    let roomsCache = {};
    let messagesCache = [];
    let profilesCache = {};
    let bansCache = {};

    let selectedAvatar = DEFAULT_AVATAR;
    let intentionalSignOut = false;

    // ========================================
    // DOM
    // ========================================
    const loginView = document.getElementById('loginView');
    const mainView = document.getElementById('mainView');
    const roomListView = document.getElementById('roomListView');
    const chatView = document.getElementById('chatView');
    const roomsContainer = document.getElementById('roomsContainer');
    const messagesContainer = document.getElementById('messagesContainer');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');
    const statusBanner = document.getElementById('statusBanner');
    const myAvatar = document.getElementById('myAvatar');
    const myName = document.getElementById('myName');
    const bootOverlay = document.getElementById('bootOverlay');
    const banOverlay = document.getElementById('banOverlay');
    let bannerTimer = null;

    // ========================================
    // ユーティリティ
    // ========================================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatContent(str) {
      if (!str) return '';
      const escaped = escapeHtml(str);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlRegex, (url) =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`);
    }

    function formatTime(ts) {
      if (!ts) return '';
      try {
        return new Date(ts).toLocaleString('ja-JP', {
          month: 'numeric', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch (e) { return ''; }
    }

    function setConnection(online) {
      if (online) {
        connDot.className = 'inline-block w-2 h-2 rounded-full bg-green-500';
        connText.textContent = 'オンライン';
      } else {
        connDot.className = 'inline-block w-2 h-2 rounded-full bg-red-500';
        connText.textContent = 'オフライン';
      }
    }

    function showBanner(msg, isError = true) {
      statusBanner.textContent = msg;
      statusBanner.className = (isError ? 'bg-red-600' : 'bg-green-600') + ' text-white show';
      statusBanner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;padding:6px;font-size:12px;transform:translateY(0);';
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        statusBanner.style.transform = 'translateY(-100%)';
      }, 3500);
    }

    // ========================================
    // プロフィール監視
    // ========================================
    function initProfilesListener() {
      if (profilesUnsubscribe) profilesUnsubscribe();
      const profilesRef = ref(db, 'chatProfiles');
      profilesUnsubscribe = onValue(profilesRef, (snap) => {
        profilesCache = snap.exists() ? snap.val() : {};
        if (currentUser && profilesCache[currentUser.uid]) {
          const p = profilesCache[currentUser.uid];
          myProfile = {
            nickname: p.nickname || currentUser.displayName || '名無しさん',
            avatar: p.avatar || currentUser.photoURL || DEFAULT_AVATAR
          };
          updateMyProfileUI();
        }
        if (currentRoomId) renderMessages();
      }, (err) => {
        console.error('プロフィール監視エラー:', err);
      });
    }

    function updateMyProfileUI() {
      myAvatar.src = myProfile.avatar || DEFAULT_AVATAR;
      myName.textContent = myProfile.nickname || '名無しさん';
    }

    function getProfileForUid(uid) {
      if (!uid) return { nickname: '名無しさん', avatar: DEFAULT_AVATAR };
      const p = profilesCache[uid];
      if (p) {
        return {
          nickname: p.nickname || '名無しさん',
          avatar: p.avatar || DEFAULT_AVATAR
        };
      }
      return { nickname: '名無しさん', avatar: DEFAULT_AVATAR };
    }

    // ========================================
    // BAN監視
    // ========================================
    function initBansListener() {
      if (bansUnsubscribe) bansUnsubscribe();
      const bansRef = ref(db, 'bans');
      bansUnsubscribe = onValue(bansRef, (snap) => {
        bansCache = snap.exists() ? snap.val() : {};
        if (currentUser && bansCache[currentUser.uid]) {
          executeBan();
        }
      }, (err) => {
        console.error('BAN監視エラー:', err);
      });
    }

    function executeBan() {
      banOverlay.classList.add('show');
      document.body.style.background = '#000';
    }

    // ========================================
    // ルーム管理
    // ========================================
    function initRoomsListener() {
      if (roomsUnsubscribe) roomsUnsubscribe();
      const roomsRef = ref(db, 'chatRooms');

      console.log('🔌 ルーム読み込み開始...');

      const timeoutId = setTimeout(() => {
        if (roomsContainer.querySelector('.loading-spinner')) {
          console.error('⏱️ ルーム読み込みタイムアウト');
          roomsContainer.innerHTML = `
            <div class="text-red-600 text-sm bg-red-50 border border-red-200 rounded p-3">
              ⚠️ ルームの読み込みがタイムアウトしました。<br>
              以下を確認してください：<br>
              ・Firebase Realtime Database のルールが <code>auth != null</code> になっているか<br>
              ・ネットワーク接続<br>
              <button onclick="location.reload()" class="mt-2 bg-red-600 text-white px-3 py-1 rounded text-xs">再読み込み</button>
            </div>`;
          setConnection(false);
        }
      }, 5000);

      roomsUnsubscribe = onValue(roomsRef, (snap) => {
        clearTimeout(timeoutId);
        console.log('✅ ルーム取得成功:', snap.exists() ? Object.keys(snap.val()).length + '件' : '0件（空）');

        roomsCache = snap.exists() ? snap.val() : {};
        setConnection(true);
        renderRooms();
      }, (err) => {
        clearTimeout(timeoutId);
        console.error('❌ ルーム監視エラー:', err);

        let hint = '';
        if (err.code === 'PERMISSION_DENIED' || (err.message && err.message.includes('permission'))) {
          hint = `
            <div class="mt-2 text-xs text-left">
              <strong>Firebase Console で以下を確認：</strong><br>
              Realtime Database → ルール タブ → 以下を貼り付け：<br>
              <pre class="bg-white border rounded p-2 mt-1 overflow-auto text-[10px]">{
  "rules": {
    ".read": "auth != null",
    ".write": "auth != null"
  }
}</pre>
            </div>`;
        }

        roomsContainer.innerHTML = `
          <div class="text-red-600 text-sm bg-red-50 border border-red-200 rounded p-3">
            ⚠️ ルームの読み込みに失敗しました。<br>
            <span class="text-xs">${escapeHtml(err.message || err.code || '不明なエラー')}</span>
            ${hint}
          </div>`;
        setConnection(false);
      });
    }

    function renderRooms() {
      roomsContainer.innerHTML = '';
      const entries = Object.entries(roomsCache || {});

      if (entries.length === 0) {
        roomsContainer.innerHTML = `
          <div class="text-gray-500 text-sm bg-white border border-gray-300 rounded p-6 text-center">
            💬 まだルームがありません。<br>
            <span class="text-xs text-gray-400">上のフォームから最初のルームを作成してください。</span>
          </div>`;
        return;
      }

      entries.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

      entries.forEach(([key, room]) => {
        const item = document.createElement('div');
        item.className = 'bg-white p-4 border border-gray-300 rounded hover:bg-blue-50 cursor-pointer transition flex justify-between items-center shadow-sm';
        item.onclick = () => openRoom(key, room.name);

        const date = room.createdAt ? formatTime(room.createdAt) : '';

        item.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="font-bold text-blue-900 break-words">💬 ${escapeHtml(room.name || '無題のルーム')}</div>
            <div class="text-xs text-gray-500 mt-1">作成: ${date} ／ 作成者: ${escapeHtml(room.createdByName || '不明')}</div>
          </div>
          <span class="text-xs bg-blue-200 text-blue-800 px-2 py-1 rounded-full ml-2 whitespace-nowrap">開く</span>
        `;
        roomsContainer.appendChild(item);
      });
    }

    document.getElementById('createRoomBtn').addEventListener('click', async () => {
      if (!currentUser) return;
      const input = document.getElementById('newRoomName');
      const name = input.value.trim();
      if (!name) { alert('ルーム名を入力してください。'); return; }

      try {
        const roomsRef = ref(db, 'chatRooms');
        const newRef = push(roomsRef);
        await set(newRef, {
          name: name,
          createdAt: Date.now(),
          createdBy: currentUser.uid,
          createdByName: myProfile.nickname
        });
        input.value = '';
        showBanner('ルームを作成しました', false);
      } catch (err) {
        console.error('ルーム作成エラー:', err);
        showBanner('作成失敗: ' + (err.code || err.message), true);
      }
    });

    // ========================================
    // チャット画面
    // ========================================
    function openRoom(roomId, roomName) {
      currentRoomId = roomId;
      document.getElementById('currentRoomName').textContent = '💬 ' + roomName;
      document.getElementById('currentRoomMeta').textContent = 'リアルタイム同期中';
      roomListView.classList.add('hidden');
      chatView.classList.remove('hidden');
      loadMessages(roomId);
    }

    window.backToRooms = function() {
      currentRoomId = null;
      chatView.classList.add('hidden');
      roomListView.classList.remove('hidden');
      if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
      messagesCache = [];
    };

    function loadMessages(roomId) {
      if (messagesUnsubscribe) { messagesUnsubscribe(); messagesUnsubscribe = null; }
      messagesContainer.innerHTML = '<p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>';

      const msgsRef = ref(db, `chatMessages/${roomId}`);
      const q = query(msgsRef, orderByChild('createdAt'));

      messagesUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        messagesCache = [];
        if (snapshot.exists()) {
          snapshot.forEach((child) => {
            messagesCache.push({ key: child.key, ...child.val() });
          });
          messagesCache.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        }
        renderMessages();
      }, (err) => {
        console.error('メッセージ監視エラー:', err);
        setConnection(false);
        messagesContainer.innerHTML = '<p class="text-red-500 text-sm">読み込みに失敗しました。</p>';
      });
    }

    function renderMessages() {
      messagesContainer.innerHTML = '';
      if (messagesCache.length === 0) {
        messagesContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">まだメッセージがありません。最初のメッセージを送ってみましょう！</p>';
        return;
      }

      const frag = document.createDocumentFragment();
      messagesCache.forEach((msg) => {
        const isMine = currentUser && msg.authorUid === currentUser.uid;
        const profile = getProfileForUid(msg.authorUid);

        const row = document.createElement('div');
        row.className = 'msg-row' + (isMine ? ' mine' : '');

        const fileHtml = msg.file && msg.file.dataUrl
          ? `<div class="msg-file"><a href="${msg.file.dataUrl}" target="_blank" rel="noopener">
              <img src="${msg.file.dataUrl}" alt="${escapeHtml(msg.file.name || '')}" loading="lazy">
             </a></div>`
          : '';

        row.innerHTML = `
          <img class="avatar" src="${escapeHtml(profile.avatar)}" alt="">
          <div style="max-width: 75%;">
            <div class="msg-meta ${isMine ? 'text-right' : ''}">
              <span class="name">${escapeHtml(profile.nickname)}</span>
              <span class="time">${formatTime(msg.createdAt)}</span>
            </div>
            <div class="msg-bubble">
              ${msg.content ? `<div class="msg-content">${formatContent(msg.content)}</div>` : ''}
              ${fileHtml}
            </div>
          </div>
        `;
        frag.appendChild(row);
      });
      messagesContainer.appendChild(frag);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ========================================
    // メッセージ送信
    // ========================================
    const messageInput = document.getElementById('messageInput');
    const messageFileInput = document.getElementById('messageFileInput');
    const messagePreviewBox = document.getElementById('messagePreviewBox');
    const messagePreviewImg = document.getElementById('messagePreviewImg');
    const messagePreviewInfo = document.getElementById('messagePreviewInfo');

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('messageForm').requestSubmit();
      }
    });

    messageFileInput.addEventListener('change', async () => {
      const f = messageFileInput.files[0];
      if (!f) { messagePreviewBox.classList.add('hidden'); return; }
      try {
        const r = await fileToBase64Image(f);
        messagePreviewImg.src = r.dataUrl;
        messagePreviewInfo.textContent = `${f.name}（${r.width}×${r.height}）`;
        messagePreviewBox.classList.remove('hidden');
      } catch (err) {
        alert(err.message);
        messageFileInput.value = '';
        messagePreviewBox.classList.add('hidden');
      }
    });

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { alert('ログインが必要です。'); return; }
      if (!currentRoomId) return;
      if (bansCache[currentUser.uid]) { executeBan(); return; }

      const content = messageInput.value.trim();
      const file = messageFileInput.files[0];
      if (!content && !file) return;

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = file ? '画像処理中...' : '送信中...';

      try {
        let fileData = null;
        if (file) fileData = await fileToBase64Image(file);

        const msgsRef = ref(db, `chatMessages/${currentRoomId}`);
        const newRef = push(msgsRef);
        await set(newRef, {
          content: content || '',
          file: fileData,
          authorUid: currentUser.uid,
          authorName: myProfile.nickname,
          authorAvatar: myProfile.avatar,
          createdAt: Date.now()
        });

        messageInput.value = '';
        messageInput.style.height = 'auto';
        messageFileInput.value = '';
        messagePreviewBox.classList.add('hidden');
      } catch (err) {
        console.error('送信エラー:', err);
        showBanner('送信失敗: ' + (err.message || ''), true);
        alert('送信に失敗しました。');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '送信';
      }
    });

    // ========================================
    // プロフィールモーダル
    // ========================================
    const profileModal = document.getElementById('profileModal');
    const profileAvatarPreview = document.getElementById('profileAvatarPreview');
    const presetAvatarRow = document.getElementById('presetAvatarRow');
    const nicknameInput = document.getElementById('nicknameInput');
    const avatarFileInput = document.getElementById('avatarFileInput');

    function buildPresetAvatars() {
      presetAvatarRow.innerHTML = '';
      PRESET_AVATARS.forEach((url) => {
        const img = document.createElement('img');
        img.className = 'preset-avatar' + (url === selectedAvatar ? ' selected' : '');
        img.src = url;
        img.addEventListener('click', () => {
          selectedAvatar = url;
          profileAvatarPreview.src = url;
          presetAvatarRow.querySelectorAll('.preset-avatar').forEach(el => el.classList.remove('selected'));
          img.classList.add('selected');
        });
        presetAvatarRow.appendChild(img);
      });
    }

    document.getElementById('profileBtn').addEventListener('click', () => {
      nicknameInput.value = myProfile.nickname || '';
      selectedAvatar = myProfile.avatar || DEFAULT_AVATAR;
      profileAvatarPreview.src = selectedAvatar;
      avatarFileInput.value = '';
      buildPresetAvatars();
      profileModal.classList.remove('hidden');
    });

    document.getElementById('profileCancelBtn').addEventListener('click', () => {
      profileModal.classList.add('hidden');
    });

    profileModal.addEventListener('click', (e) => {
      if (e.target.id === 'profileModal') profileModal.classList.add('hidden');
    });

    avatarFileInput.addEventListener('change', async () => {
      const f = avatarFileInput.files[0];
      if (!f) return;
      try {
        const r = await fileToBase64Image(f, 200, 60 * 1024);
        selectedAvatar = r.dataUrl;
        profileAvatarPreview.src = r.dataUrl;
        presetAvatarRow.querySelectorAll('.preset-avatar').forEach(el => el.classList.remove('selected'));
      } catch (err) {
        alert(err.message);
        avatarFileInput.value = '';
      }
    });

    document.getElementById('profileSaveBtn').addEventListener('click', async () => {
      if (!currentUser) return;
      const nickname = nicknameInput.value.trim();
      if (!nickname) { alert('ニックネームを入力してください。'); return; }
      if (nickname.length > 20) { alert('ニックネームは20文字以内です。'); return; }

      try {
        await set(ref(db, `chatProfiles/${currentUser.uid}`), {
          nickname: nickname,
          avatar: selectedAvatar,
          email: currentUser.email || '',
          updatedAt: Date.now()
        });
        myProfile = { nickname, avatar: selectedAvatar };
        updateMyProfileUI();
        profileModal.classList.add('hidden');
        showBanner('プロフィールを保存しました', false);
      } catch (err) {
        console.error('プロフィール保存エラー:', err);
        showBanner('保存失敗: ' + (err.message || ''), true);
      }
    });

    // ========================================
    // 認証
    // ========================================
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error('ログインエラー:', err);
        if (err.code !== 'auth/popup-closed-by-user') {
          alert('ログインに失敗しました: ' + (err.message || ''));
        }
      }
    });

    document.getElementById('switchAccountBtn').addEventListener('click', async () => {
      intentionalSignOut = true;
      try { await signOut(auth); } catch (e) {}
      banOverlay.classList.remove('show');
      document.body.style.background = '';
      loginView.classList.remove('hidden');
      mainView.classList.add('hidden');
      bootOverlay.classList.add('hidden');
      setTimeout(() => { intentionalSignOut = false; }, 500);
    });

    window.doLogout = async function() {
      intentionalSignOut = true;
      if (roomsUnsubscribe) roomsUnsubscribe();
      if (messagesUnsubscribe) messagesUnsubscribe();
      if (profilesUnsubscribe) profilesUnsubscribe();
      if (bansUnsubscribe) bansUnsubscribe();
      try { await signOut(auth); } catch (e) {}
      loginView.classList.remove('hidden');
      mainView.classList.add('hidden');
      bootOverlay.classList.add('hidden');
      setTimeout(() => { intentionalSignOut = false; }, 500);
    };

    document.getElementById('logoutBtn').addEventListener('click', doLogout);

    // ========================================
    // 認証状態監視
    // ========================================
    onAuthStateChanged(auth, async (user) => {
      if (intentionalSignOut) return;

      currentUser = user;

      if (!user) {
        loginView.classList.remove('hidden');
        mainView.classList.add('hidden');
        bootOverlay.classList.add('hidden');
        return;
      }

      // BANチェック
      try {
        const bansSnap = await get(ref(db, 'bans'));
        bansCache = bansSnap.exists() ? bansSnap.val() : {};
        if (bansCache[user.uid]) {
          executeBan();
          return;
        }
      } catch (e) {
        console.warn('BANチェックエラー:', e.message);
      }

      // プロフィール取得（初回は自動作成）
      try {
        const profileSnap = await get(ref(db, `chatProfiles/${user.uid}`));
        if (profileSnap.exists()) {
          const p = profileSnap.val();
          myProfile = {
            nickname: p.nickname || user.displayName || '名無しさん',
            avatar: p.avatar || user.photoURL || DEFAULT_AVATAR
          };
        } else {
          myProfile = {
            nickname: user.displayName || '名無しさん',
            avatar: user.photoURL || DEFAULT_AVATAR
          };
          await set(ref(db, `chatProfiles/${user.uid}`), {
            nickname: myProfile.nickname,
            avatar: myProfile.avatar,
            email: user.email || '',
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
        }
      } catch (e) {
        console.warn('プロフィール取得エラー:', e.message);
        myProfile = {
          nickname: user.displayName || '名無しさん',
          avatar: user.photoURL || DEFAULT_AVATAR
        };
      }

      updateMyProfileUI();
      loginView.classList.add('hidden');
      mainView.classList.remove('hidden');
      bootOverlay.classList.add('hidden');
      setConnection(navigator.onLine);

      initProfilesListener();
      initBansListener();
      initRoomsListener();
    });

    // 右クリック・ドラッグ防止
    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      e.preventDefault();
    });

    window.addEventListener('online', () => setConnection(true));
    window.addEventListener('offline', () => setConnection(false));

    window.addEventListener('beforeunload', () => {
      if (roomsUnsubscribe) roomsUnsubscribe();
      if (messagesUnsubscribe) messagesUnsubscribe();
      if (profilesUnsubscribe) profilesUnsubscribe();
      if (bansUnsubscribe) bansUnsubscribe();
    });
  </script>
</body>
</html>
