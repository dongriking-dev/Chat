/* ★ 拡大表示モーダル */
let fullscreenCurrentMode = null; // 'remote' | 'local'

function openFullscreenVideo(mode) {
  fullscreenCurrentMode = mode;
  const modal = document.getElementById('fullscreenVideoModal');
  const fsvVideo = document.getElementById('fsvVideo');
  const fallback = document.getElementById('fsvAvatarFallback');
  const label = document.getElementById('fsvLabel');

  if (mode === 'remote') {
    label.textContent = '相手の映像';
    const stream = callState.incomingStream;
    const remoteVideo = document.getElementById('cpRemoteVideo');
    if (stream && stream.getVideoTracks().some(t => t.readyState === 'live' && !t.muted)) {
      fsvVideo.srcObject = stream;
      fsvVideo.style.display = 'block';
      fallback.style.display = 'none';
      fsvVideo.play().catch(() => {});
    } else {
      fsvVideo.srcObject = null;
      fsvVideo.style.display = 'none';
      fallback.style.display = 'flex';

    }
  } else if (mode === 'local') {
    label.textContent = '自分の映像';
    const stream = callState.screenStream || (callState.localStream && callState.localStream.getVideoTracks().length > 0 ? callState.localStream : null);
    if (stream) {
      fsvVideo.srcObject = stream;
      fsvVideo.style.display = 'block';
      fallback.style.display = 'none';
      fsvVideo.play().catch(() => {});
    } else {
      fsvVideo.srcObject = null;
      fsvVideo.style.display = 'none';
      fallback.style.display = 'flex';
      document.getElementById('fsvAvatarImg').src = myProfile.avatar;
      document.getElementById('fsvName').textContent = myProfile.nickname;

/* ★ 映像表示更新 */
function updateRemoteVideoDisplay(stream) {
  const remoteVideo = document.getElementById('cpRemoteVideo');
  const fallback = document.getElementById('cpAvatarFallback');
  const hasVideo = stream && stream.getVideoTracks().some(t => t.readyState === 'live' && !t.muted);
  if (hasVideo) {
    remoteVideo.style.display = 'block';
    fallback.style.display = 'none';
    remoteVideo.play().catch(() => {});
  } else {
    remoteVideo.style.display = 'none';
    fallback.style.display = 'flex';
  }
  // 全画面モーダルが開いていて相手映像モードなら同期
  if (fullscreenCurrentMode === 'remote') {
    const fsvVideo = document.getElementById('fsvVideo');
    if (hasVideo) {
      if (fsvVideo.srcObject !== stream) fsvVideo.srcObject = stream;
      fsvVideo.style.display = 'block';
      document.getElementById('fsvAvatarFallback').style.display = 'none';
      fsvVideo.play().catch(() => {});
    } else {
      fsvVideo.srcObject = null;
      fsvVideo.style.display = 'none';
      document.getElementById('fsvAvatarFallback').style.display = 'flex';
      document.getElementById('fsvAvatarImg').src = document.getElementById('cpAvatarImg').src;
      document.getElementById('fsvName').textContent = document.getElementById('cpName').textContent;
      document.getElementById('fsvStatus').textContent = document.getElementById('cpStatus').textContent || '映像なし';
    }
  }
}

function attachRemoteStream(stream) {
  const remoteVideo = document.getElementById('cpRemoteVideo');
  if (remoteVideo.srcObject !== stream) {
    remoteVideo.srcObject = stream;
  }
  updateRemoteVideoDisplay(stream);
  stream.onaddtrack = () => updateRemoteVideoDisplay(stream);
  stream.onremovetrack = () => updateRemoteVideoDisplay(stream);
  remoteVideo.play().catch(() => {});
}

function startCallVideoCheck() {
  if (callVideoCheckInterval) clearInterval(callVideoCheckInterval);
  callVideoCheckInterval = setInterval(() => {
    if (!callState.active || !callState.pc) return;
    // 受信側の映像トラックをチェック
    const receivers = callState.pc.getReceivers();
    const videoReceiver = receivers.find(r => r.track && r.track.kind === 'video' && r.track.readyState === 'live');
    if (videoReceiver) {
      const remoteVideo = document.getElementById('cpRemoteVideo');
      if (remoteVideo.srcObject) {
        updateRemoteVideoDisplay(remoteVideo.srcObject);
      } else if (callState.incomingStream) {
        attachRemoteStream(callState.incomingStream);
      }
    }
  }, 500);
}
function stopCallVideoCheck() {
  if (callVideoCheckInterval) { clearInterval(callVideoCheckInterval); callVideoCheckInterval = null; }
}

/* ★ 映像トラックを replaceTrack で差し替える（再ネゴシエーション不要） */
async function switchOutgoingVideo(newTrack) {
  if (!callState.pc) return;
  // 既存の映像 sender を使う
  if (callState.videoSender) {
    try {
      await callState.videoSender.replaceTrack(newTrack);
    } catch (e) {
      console.warn('replaceTrack失敗:', e);
    }
  } else {
    // sender が無ければ探す
    const sender = callState.pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) {
      callState.videoSender = sender;
      try { await sender.replaceTrack(newTrack); } catch (e) {}
    } else if (newTrack) {
      // 本当に無ければ addTrack（初回のみ、その後は replaceTrack で運用）
      const stream = new MediaStream([newTrack]);
      callState.videoSender = callState.pc.addTrack(newTrack, stream);
    }
  }
  // ローカルプレビュー更新
  updateCallUI();
}

async function startCall(peerUid) {
  if (callState.active) { showBanner('既に通話中です', true); return; }
  if (!currentUser || !currentChatId) return;

  callState.active = true;
  callState.role = 'caller';
  callState.chatId = currentChatId;
  callState.peerUid = peerUid;
  callState.connected = false;
  callState.isMinimized = false;
  callState.micEnabled = true;
  callState.camEnabled = false;
  callState.screenSharing = false;
  callState.remoteDescSet = false;
  callState.pendingCandidates = [];

  const sessionRef = push(ref(db, `calls/${currentUser.uid}`));
  callState.sessionId = sessionRef.key;
  callState.callDocRef = sessionRef;

  const peerProfile = getProfileForUid(peerUid);

  try {
    const localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    callState.localStream = localStream;
  } catch (e) {
    console.warn('マイク取得失敗:', e);
    showBanner('マイクへのアクセスが拒否されました', true);
  }

  const pc = new RTCPeerConnection(ICE_SERVERS);
  callState.pc = pc;

  // 音声トラック追加
  if (callState.localStream) {
    callState.localStream.getTracks().forEach(track => pc.addTrack(track, callState.localStream));
  }

  // ★ 映像用の transceiver を事前に作成（sendrecv, トラックなし）
  const videoTransceiver = pc.addTransceiver('video', { direction: 'sendrecv' });
  callState.videoTransceiver = videoTransceiver;
  callState.videoSender = videoTransceiver.sender;

  pc.onicecandidate = (e) => {
    if (e.candidate && callState.sessionId) {
      const candRef = ref(db, `calls/${currentUser.uid}/${callState.sessionId}/callerCandidates`);
      push(candRef, e.candidate.toJSON());
    }
  };

  pc.ontrack = (e) => {
    // 映像・音声どちらのトラックも受信
    if (e.streams && e.streams[0]) {
      callState.incomingStream = e.streams[0];
      attachRemoteStream(e.streams[0]);
    } else if (e.track) {
      // ストリームが無い場合、トラックから MediaStream を作成
      let stream = callState.incomingStream;
      if (!stream) {
        stream = new MediaStream();
        callState.incomingStream = stream;
      }
      // 既存のトラックを確認して置き換え
      const existingTracks = stream.getTracks();
      const sameKind = existingTracks.filter(t => t.kind === e.track.kind);
      sameKind.forEach(t => stream.removeTrack(t));
      stream.addTrack(e.track);
      attachRemoteStream(stream);
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      callState.connected = true;
      updateCallUI();
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      showBanner('通話接続が切断されました', true);
      endCall(false);
    }
  };

  const offerDesc = await pc.createOffer();
  await pc.setLocalDescription(offerDesc);

  const callData = {
    fromUid: currentUser.uid,
    fromName: myProfile.nickname,
    fromAvatar: myProfile.avatar,
    toUid: peerUid,
    chatId: currentChatId,
    status: 'ringing',
    createdAt: Date.now(),
    callerDescription: { type: offerDesc.type, sdp: offerDesc.sdp }
  };

  await set(sessionRef, callData);
  await set(ref(db, `calls/${peerUid}/${sessionRef.key}`), callData);

  const peerSessionRef = ref(db, `calls/${peerUid}/${sessionRef.key}`);
  if (callState.unsub) callState.unsub();
  callState.unsub = onValue(peerSessionRef, async (snap) => {
    if (!snap.exists()) return;
    const data = snap.val();

    if (data.calleeDescription && !callState.remoteDescSet) {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.calleeDescription));
        callState.remoteDescSet = true;
        for (const cand of callState.pendingCandidates) {
          try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
        }
        callState.pendingCandidates = [];
      } catch (e) { console.warn('setRemoteDescription失敗:', e); }
    }

    if (data.calleeCandidates) {
      const cands = Object.values(data.calleeCandidates);
      if (!callState.remoteDescSet) {
        cands.forEach(c => callState.pendingCandidates.push(c));
      } else {
        for (const cand of cands) {
          try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
        }
      }
    }

    if (data.status === 'accepted' && !callState.connected) {
      callState.connected = true;
      updateCallUI();
    }
    if (data.status === 'rejected' || data.status === 'ended') {
      showBanner('相手が通話を終了しました', true);
      endCall(false);
    }
  });

  showCallPanel(peerProfile, '発信中...');
  startCallVideoCheck();
}

let incomingCallUnsubs = {};
function initCallIncomingListener() {
  if (!currentUser) return;
  const myCallsRef = ref(db, `calls/${currentUser.uid}`);
  if (incomingCallUnsubs.myCalls) incomingCallUnsubs.myCalls();
  incomingCallUnsubs.myCalls = onValue(myCallsRef, (snap) => {
    if (!snap.exists()) return;
    const calls = snap.val();
    if (callState.active) return;
    for (const [sid, data] of Object.entries(calls)) {
      if (data.status === 'ringing' && data.toUid === currentUser.uid && data.fromUid !== currentUser.uid) {
        showIncomingCall(sid, data);
        return;
      }
    }
  }, () => {});
}

let incomingCallSessionId = null;
function showIncomingCall(sessionId, data) {
  if (incomingCallSessionId === sessionId) return;
  incomingCallSessionId = sessionId;
  const fromProfile = getProfileForUid(data.fromUid);
  document.getElementById('icAvatar').src = fromProfile.avatar;
  document.getElementById('icName').textContent = fromProfile.nickname;
  document.getElementById('icStatus').textContent = '着信中...';
  document.getElementById('incomingCallOverlay').classList.add('show');
  playIncomingSound();
}
let incomingAudioCtx = null;
function playIncomingSound() {
  try {
    if (!incomingAudioCtx) incomingAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (incomingAudioCtx.state === 'suspended') incomingAudioCtx.resume();
    const now = incomingAudioCtx.currentTime;
    for (let i = 0; i < 2; i++) {
      const osc = incomingAudioCtx.createOscillator();
      const gain = incomingAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 800;
      gain.gain.setValueAtTime(0, now + i * 0.5);
      gain.gain.linearRampToValueAtTime(0.2, now + i * 0.5 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.5 + 0.4);
      osc.connect(gain);
      gain.connect(incomingAudioCtx.destination);
      osc.start(now + i * 0.5);
      osc.stop(now + i * 0.5 + 0.45);
    }
  } catch (e) {}
}

document.getElementById('icAcceptBtn').addEventListener('click', async () => {
  if (!incomingCallSessionId) return;
  await acceptIncomingCall(incomingCallSessionId);
});
document.getElementById('icRejectBtn').addEventListener('click', async () => {
  if (!incomingCallSessionId) return;
  await rejectIncomingCall(incomingCallSessionId);
});
function hideIncomingCall() {
  document.getElementById('incomingCallOverlay').classList.remove('show');
  incomingCallSessionId = null;
}

async function acceptIncomingCall(sessionId) {
  if (callState.active) { hideIncomingCall(); return; }
  const callRef = ref(db, `calls/${currentUser.uid}/${sessionId}`);
  const snap = await get(callRef);
  if (!snap.exists()) { hideIncomingCall(); return; }
  const data = snap.val();
  if (data.status !== 'ringing') { hideIncomingCall(); return; }

  callState.active = true;
  callState.role = 'callee';
  callState.sessionId = sessionId;
  callState.chatId = data.chatId;
  callState.peerUid = data.fromUid;
  callState.connected = false;
  callState.isMinimized = false;
  callState.micEnabled = true;
  callState.camEnabled = false;
  callState.screenSharing = false;
  callState.callDocRef = callRef;
  callState.remoteDescSet = false;
  callState.pendingCandidates = [];

  try {
    const localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    callState.localStream = localStream;
  } catch (e) {
    showBanner('マイクへのアクセスが拒否されました', true);
  }

  const pc = new RTCPeerConnection(ICE_SERVERS);
  callState.pc = pc;

  if (callState.localStream) {
    callState.localStream.getTracks().forEach(track => pc.addTrack(track, callState.localStream));
  }

  // ★ 映像用 transceiver を事前作成
  const videoTransceiver = pc.addTransceiver('video', { direction: 'sendrecv' });
  callState.videoTransceiver = videoTransceiver;
  callState.videoSender = videoTransceiver.sender;

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      const candRef = ref(db, `calls/${currentUser.uid}/${sessionId}/calleeCandidates`);
      push(candRef, e.candidate.toJSON());
    }
  };
  pc.ontrack = (e) => {
    if (e.streams && e.streams[0]) {
      callState.incomingStream = e.streams[0];
      attachRemoteStream(e.streams[0]);
    } else if (e.track) {
      let stream = callState.incomingStream;
      if (!stream) {
        stream = new MediaStream();
        callState.incomingStream = stream;
      }
      const existingTracks = stream.getTracks();
      const sameKind = existingTracks.filter(t => t.kind === e.track.kind);
      sameKind.forEach(t => stream.removeTrack(t));
      stream.addTrack(e.track);
      attachRemoteStream(stream);
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') { callState.connected = true; updateCallUI(); }
    else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      showBanner('通話接続が切断されました', true);
      endCall(false);
    }
  };

  if (data.callerDescription) {
    try {
      await pc.setRemoteDescription(new RTCSessionDescription(data.callerDescription));
      callState.remoteDescSet = true;
    } catch (e) { console.warn('setRemoteDescription失敗:', e); }
  }

  const answerDesc = await pc.createAnswer();
  await pc.setLocalDescription(answerDesc);

  const answerData = {
    calleeDescription: { type: answerDesc.type, sdp: answerDesc.sdp },
    status: 'accepted'
  };

  await update(callRef, answerData);
  await update(ref(db, `calls/${data.fromUid}/${sessionId}`), answerData);

  if (callState.unsub) callState.unsub();
  callState.unsub = onValue(ref(db, `calls/${data.fromUid}/${sessionId}`), async (snap) => {
    if (!snap.exists()) return;
    const cd = snap.val();

    if (cd.callerDescription && !callState.remoteDescSet) {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(cd.callerDescription));
        callState.remoteDescSet = true;
        for (const cand of callState.pendingCandidates) {
          try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
        }
        callState.pendingCandidates = [];
      } catch (e) {}
    }

    if (cd.callerCandidates) {
      const cands = Object.values(cd.callerCandidates);
      if (!callState.remoteDescSet) {
        cands.forEach(c => callState.pendingCandidates.push(c));
      } else {
        for (const cand of cands) {
          try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
        }
      }
    }

    if (cd.status === 'ended') {
      endCall(false);
    }
  });

  hideIncomingCall();
  const peerProfile = getProfileForUid(data.fromUid);
  showCallPanel(peerProfile, '接続中...');
  startCallVideoCheck();
}

async function rejectIncomingCall(sessionId) {
  const callRef = ref(db, `calls/${currentUser.uid}/${sessionId}`);
  try {
    const snap = await get(callRef);
    if (snap.exists()) {
      const data = snap.val();
      await update(callRef, { status: 'rejected' });
      await update(ref(db, `calls/${data.fromUid}/${sessionId}`), { status: 'rejected' });
    }
    await remove(callRef);
  } catch (e) {}
  hideIncomingCall();
}

function showCallPanel(peerProfile, statusText) {
  document.getElementById('cpTitle').textContent = `通話: ${peerProfile.nickname}`;

  updateCallUI();
}

function updateCallUI() {
  if (callState.connected) {
    document.getElementById('cpStatusBar').textContent = '通話中';
    document.getElementById('cpStatus').textContent = '通話中';
  }
  const micBtn = document.getElementById('cpMicBtn');
  micBtn.classList.toggle('off', !callState.micEnabled);
  micBtn.innerHTML = callState.micEnabled ? iconMic(22, '#fff') : iconMicOff(22, '#fff');
  const camBtn = document.getElementById('cpCamBtn');
  camBtn.classList.toggle('off', !callState.camEnabled);
  const shareBtn = document.getElementById('cpShareBtn');
  shareBtn.classList.toggle('on', callState.screenSharing);
  const pip = document.getElementById('cpPip');
  const localVideo = document.getElementById('cpLocalVideo');
  if (callState.screenStream || (callState.localStream && callState.localStream.getVideoTracks().length > 0)) {
    const streamToShow = callState.screenStream || callState.localStream;
    localVideo.srcObject = streamToShow;
    pip.classList.add('show');
  } else {
    pip.classList.remove('show');
    localVideo.srcObject = null;
  }
  // 全画面モーダルで自分の映像を見ている場合は同期
  if (fullscreenCurrentMode === 'local') {
    const fsvVideo = document.getElementById('fsvVideo');
    const stream = callState.screenStream || (callState.localStream && callState.localStream.getVideoTracks().length > 0 ? callState.localStream : null);
    if (stream) {
      if (fsvVideo.srcObject !== stream) fsvVideo.srcObject = stream;
      fsvVideo.style.display = 'block';
      document.getElementById('fsvAvatarFallback').style.display = 'none';
      fsvVideo.play().catch(() => {});
    } else {
      fsvVideo.srcObject = null;
      fsvVideo.style.display = 'none';
      document.getElementById('fsvAvatarFallback').style.display = 'flex';
      document.getElementById('fsvAvatarImg').src = myProfile.avatar;
      document.getElementById('fsvName').textContent = myProfile.nickname;
      document.getElementById('fsvStatus').textContent = '映像なし';
    }
  }
}

document.getElementById('cpMicBtn').addEventListener('click', () => {
  callState.micEnabled = !callState.micEnabled;
  if (callState.localStream) {
    callState.localStream.getAudioTracks().forEach(t => { t.enabled = callState.micEnabled; });
  }
  updateCallUI();
});

/* ★ カメラ ON/OFF（replaceTrack 方式） */
document.getElementById('cpCamBtn').addEventListener('click', async () => {
  if (callState.camEnabled) {
    // OFF: 映像トラックを停止して sender を null に
    if (callState.screenStream) {
      // 画面共有中なら画面共有を優先、カメラOFFは無視
    } else {
      if (callState.localStream) {
        callState.localStream.getVideoTracks().forEach(t => { t.stop(); callState.localStream.removeTrack(t); });
      }
      await switchOutgoingVideo(null);
    }
    callState.camEnabled = false;
  } else {
    // ON
    try {
      const camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
      const videoTrack = camStream.getVideoTracks()[0];
      // ローカルストリームに追加
      if (!callState.localStream) callState.localStream = new MediaStream();
      callState.localStream.getVideoTracks().forEach(t => { t.stop(); callState.localStream.removeTrack(t); });
      callState.localStream.addTrack(videoTrack);
      // sender を差し替え（再ネゴシエーション不要）
      await switchOutgoingVideo(videoTrack);
      callState.camEnabled = true;
      callState.screenSharing = false;
    } catch (e) {
      showBanner('カメラへのアクセスが拒否されました', true);
    }
  }
  updateCallUI();
});

/* ★ 画面共有 ON/OFF（replaceTrack 方式） */
document.getElementById('cpShareBtn').addEventListener('click', async () => {
  if (callState.screenSharing) {
    // OFF
    if (callState.screenStream) {
      callState.screenStream.getTracks().forEach(t => t.stop());
      callState.screenStream = null;
    }
    // カメラがONならカメラ映像に戻す、OFFならnull
    if (callState.camEnabled && callState.localStream && callState.localStream.getVideoTracks().length > 0) {
      const camTrack = callState.localStream.getVideoTracks()[0];
      await switchOutgoingVideo(camTrack);
    } else {
      await switchOutgoingVideo(null);
    }
    callState.screenSharing = false;
  } else {
    // ON
    try {
      const screenStream = await navigator.mediaDevices.getDisplayMedia({
        video: { cursor: 'always' },
        audio: false
      });
      callState.screenStream = screenStream;
      const screenTrack = screenStream.getVideoTracks()[0];
      screenTrack.onended = async () => {
        callState.screenSharing = false;
        if (callState.screenStream) { callState.screenStream.getTracks().forEach(t => t.stop()); callState.screenStream = null; }
        if (callState.camEnabled && callState.localStream && callState.localStream.getVideoTracks().length > 0) {
          const camTrack = callState.localStream.getVideoTracks()[0];
          await switchOutgoingVideo(camTrack);
        } else {
          await switchOutgoingVideo(null);
        }
        updateCallUI();
      };
      await switchOutgoingVideo(screenTrack);
      callState.screenSharing = true;
    } catch (e) {
      if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') {
        showBanner('画面共有に失敗しました', true);
      }
    }
  }
  updateCallUI();
});

document.getElementById('cpMinimizeBtn').addEventListener('click', () => {
  callState.isMinimized = !callState.isMinimized;
  document.getElementById('callPanel').classList.toggle('minimized', callState.isMinimized);
});

document.getElementById('cpEndBtn').addEventListener('click', () => endCall(true));

async function endCall(notifyRemote = true) {
  if (!callState.active) return;
  closeFullscreenVideo();
  try {
    if (notifyRemote && currentUser && callState.sessionId) {
      await update(ref(db, `calls/${currentUser.uid}/${callState.sessionId}`), { status: 'ended', endedAt: Date.now() }).catch(() => {});
      if (callState.peerUid) {
        await update(ref(db, `calls/${callState.peerUid}/${callState.sessionId}`), { status: 'ended', endedAt: Date.now() }).catch(() => {});
      }
    }
  } catch (e) {}
  if (callState.pc) { try { callState.pc.close(); } catch (e) {} }
  if (callState.localStream) { callState.localStream.getTracks().forEach(t => t.stop()); }
  if (callState.screenStream) { callState.screenStream.getTracks().forEach(t => t.stop()); }
  if (callState.unsub) { callState.unsub(); callState.unsub = null; }
  if (callState.renegotiationUnsub) { callState.renegotiationUnsub(); callState.renegotiationUnsub = null; }
  if (currentUser && callState.sessionId) {
    remove(ref(db, `calls/${currentUser.uid}/${callState.sessionId}`)).catch(() => {});
  }
  if (callState.peerUid && callState.sessionId) {
    remove(ref(db, `calls/${callState.peerUid}/${callState.sessionId}`)).catch(() => {});
  }
  stopCallVideoCheck();
  callState = {
    active: false, role: null, chatId: null, peerUid: null, sessionId: null,
    pc: null, localStream: null, screenStream: null, incomingStream: null,
    micEnabled: true, camEnabled: false, screenSharing: false,
    pendingCandidates: [], callDocRef: null,
    unsub: null, isMinimized: false, connected: false, remoteDescSet: false,
    renegotiationUnsub: null, videoSender: null, videoTransceiver: null
  };
  document.getElementById('callPanel').classList.remove('show');
  document.getElementById('cpRemoteVideo').srcObject = null;
  document.getElementById('cpLocalVideo').srcObject = null;
  hideIncomingCall();
  updateChatHeader();
}

document.getElementById('chatCallBtn').addEventListener('click', async () => {
  if (!currentChatId || !currentUser) return;
  const chat = chatsCache[currentChatId];
  if (!chat) return;
  if (chat.type !== 'direct') { showBanner('通話は1対1チャットでのみ可能です', true); return; }
  const otherUid = Object.keys(chat.members || {}).find(uid => uid !== currentUser.uid);
  if (!otherUid) return;
  if (callState.active) { showBanner('既に通話中です', true); return; }
  await startCall(otherUid);
});
